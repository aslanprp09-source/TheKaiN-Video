name: Clean rebuild — Windows tests and Android APK
on:
  push:
    branches: [rebuild-2026-11-11]
  pull_request:
    branches: [rebuild-2026-11-11]
  workflow_dispatch:
    inputs:
      build_packages:
        type: boolean
        default: false
        description: Also build unsigned experimental M6 installers/APK/AAB (no publication)
      sign_android:
        type: boolean
        default: false
        description: Explicitly request protected INTERNAL QA Android signing
permissions:
  contents: read
jobs:
  ci-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - name: Install pinned CI policy parser
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r rewrite/ci/requirements.lock
      - name: Check rebuild workflows and negative security scenarios
        run: |
          python rewrite/ci/workflow_policy.py
          python -m unittest discover -s rewrite/ci -p 'test_*.py' -v
  experimental-packages:
    if: github.event_name == 'workflow_dispatch' && inputs.build_packages
    needs: ci-policy
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rewrite-packaging.yml
    with:
      sign_android: ${{ inputs.sign_android }}
  windows-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.18"
      - name: Install media verification and Qt runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core
      - name: Install desktop dependencies
        run: python -m pip install -r rewrite/windows/requirements.txt
      - name: Run engine and headless Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s rewrite/windows -p "test_*.py" -v
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: Compile APKs and run JVM tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Lint after generated test sources are stable
        run: gradle --no-daemon :app:lintDebug
      - name: Verify executed JVM tests
        if: always()
        run: python3 tools/report-tests.py app/build/test-results/testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TheKaiN-rebuild-Android-0.1-debug
          path: rewrite/android/app/build/outputs/apk/debug/app-debug.apk
  android-device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /tmp/thekain-m4-avd
    defaults:
      run:
        working-directory: rewrite/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: Prepare official Android 35 emulator
        id: prepare-emulator
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=M4 emulator setup::Failed command on line $LINENO: $BASH_COMMAND"' ERR
          echo "::notice title=M4 emulator host::$(uname -m); ANDROID_HOME=$ANDROID_HOME; KVM=$(ls -l /dev/kvm 2>&1)"
          test -e /dev/kvm
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 libnss3
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n M4 -k 'system-images;android-35;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd M4 -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader -memory 2048 -cores 2 -port 5554 > "$RUNNER_TEMP/m4-emulator.log" 2>&1 &
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          for i in $(seq 1 180); do
            if [ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
      - name: Expose emulator startup diagnostics
        if: failure()
        run: |
          python3 - <<'PYLOG'
          import pathlib, os
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm4-emulator.log'
          content = path.read_text(errors='replace')[-6500:] if path.exists() else 'No emulator log was created.'
          print('::error title=M4 emulator log::' + content.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYLOG
      - name: Run actual device integration tests
        run: |
          gradle --no-daemon :app:installDebug :app:installDebugAndroidTest
          adb -s "$ANDROID_SERIAL" shell pm grant com.thekain.video.rebuild android.permission.POST_NOTIFICATIONS
          gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.thekain.video.ProcessRestartTest,com.thekain.video.NotificationDeniedTest,com.thekain.video.M5VisualTest
      - name: Verify instrumentation results
        if: always()
        run: python3 tools/report-tests.py app/build/outputs/androidTest-results/connected
      - name: Cold process restart and adb UI evidence
        run: |
          gradle --no-daemon :app:installDebug :app:installDebugAndroidTest
          bash tools/process-restart-smoke.sh "$RUNNER_TEMP/m4-device-evidence"
      - name: Compose layouts at 360, 412 and 600 dp in both themes
        id: visual-matrix
        if: always() && steps.prepare-emulator.conclusion == 'success'
        run: |
          gradle --no-daemon :app:installDebug :app:installDebugAndroidTest
          bash tools/compose-visual-smoke.sh "$RUNNER_TEMP/m5-visual-evidence"
      - name: Prepare bounded UI review bundle
        if: always() && steps.visual-matrix.conclusion == 'success'
        run: |
          python3 -m pip install pillow==11.3.0
          python3 tools/visual-report.py "$RUNNER_TEMP/m5-visual-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: M5-Android-device-validation
          path: |
            rewrite/android/app/build/outputs/androidTest-results/
            rewrite/android/app/build/reports/androidTests/
            ${{ runner.temp }}/m4-device-evidence/
            ${{ runner.temp }}/m5-visual-evidence/
            ${{ runner.temp }}/m4-emulator.log

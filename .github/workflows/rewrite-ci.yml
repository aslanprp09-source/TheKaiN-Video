name: Clean rebuild — Windows tests and Android APK
on:
  push:
    branches: [rebuild-2026-11-11]
  workflow_dispatch:
jobs:
  windows-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s rewrite/windows -p "test_*.py" -v
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TheKaiN-rebuild-Android-0.1-debug
          path: rewrite/android/app/build/outputs/apk/debug/app-debug.apk

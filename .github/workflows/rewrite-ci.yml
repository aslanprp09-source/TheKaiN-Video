name: Clean rebuild — Windows tests and Android APK
on:
  push:
    branches: [rebuild-2026-11-11]
  pull_request:
    branches: [rebuild-2026-11-11]
  workflow_dispatch:
    inputs:
      build_packages:
        type: boolean
        default: false
        description: Also build unsigned experimental M6 installers/APK/AAB (no publication)
      sign_android:
        type: boolean
        default: false
        description: Explicitly request protected INTERNAL QA Android signing
      verify_artifact:
        type: boolean
        default: false
        description: Only verify a pinned signed artifact after independent review (no build/signing)
      verification_target:
        type: choice
        default: original69
        options: [original69, qa89]
        description: Fixed artifact profile; historical original69 remains the default
      bypass_preflight_comment:
        type: string
        default: ''
        description: Public Issue 6 comment ID from the fresh owner no-bypass API audit (verifier only)
      native_runtime_lab:
        type: boolean
        default: false
        description: Explicit source-built JNI lab only; no product integration or release signing
permissions:
  contents: read
jobs:
  native-runtime-build:
    if: github.event_name == 'workflow_dispatch' && inputs.native_runtime_lab && !inputs.build_packages && !inputs.sign_android && !inputs.verify_artifact
    needs: ci-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload-lab.outputs.artifact-id }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11.18'
      - id: setup-java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - id: setup-gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - id: source-build
        run: python3 rewrite/experiments/android_native/build.py --work "$RUNNER_TEMP/native-lab"
      - id: assemble-lab
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon -p rewrite/experiments/android_native/android :app:assembleDebug :app:assembleDebugAndroidTest -PlabRuntimeDir="$RUNNER_TEMP/native-lab/package"
          python3 rewrite/experiments/android_native/delivery.py pack --work "$RUNNER_TEMP/native-lab" --output "$RUNNER_TEMP/native-lab-delivery"
      - id: upload-lab
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TheKaiN-native-lab-INTERNAL-TEST
          path: ${{ runner.temp }}/native-lab-delivery/
          if-no-files-found: error
          retention-days: 1
      - id: build-diagnostics
        if: failure()
        run: python3 rewrite/experiments/android_native/diagnostics.py --work "$RUNNER_TEMP/native-lab"
  native-runtime-device-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.native_runtime_lab && !inputs.build_packages && !inputs.sign_android && !inputs.verify_artifact
    needs: native-runtime-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 26, image: google_apis, pages: 4096}
          - {api: 29, image: google_apis, pages: 4096}
          - {api: 35, image: google_apis, pages: 4096}
          - {api: 36, image: google_apis_ps16k, pages: 16384}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: setup-java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - id: download-lab
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.native-runtime-build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-lab-delivery
      - id: native-smoke
        run: bash rewrite/experiments/android_native/device-smoke.sh '${{ matrix.api }}' '${{ matrix.image }}' '${{ matrix.pages }}' "$RUNNER_TEMP/native-lab-delivery" "$RUNNER_TEMP/native-lab-evidence"
      - id: upload-evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lab-API${{ matrix.api }}-${{ matrix.pages }}
          path: ${{ runner.temp }}/native-lab-evidence/
          if-no-files-found: error
          retention-days: 7
  ci-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject conflicting native lab mode
        if: inputs.native_runtime_lab && (inputs.build_packages || inputs.sign_android || inputs.verify_artifact)
        run: exit 1
      - name: Reject conflicting or unaudited verifier mode
        if: inputs.verify_artifact && (inputs.build_packages || inputs.sign_android || !inputs.bypass_preflight_comment)
        run: exit 1
      - name: Reject unknown verification target
        if: inputs.verify_artifact && inputs.verification_target != 'original69' && inputs.verification_target != 'qa89'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned CI policy parser
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r rewrite/ci/requirements.lock
      - name: Check rebuild workflows and negative security scenarios
        run: |
          python rewrite/ci/workflow_policy.py
          python -m unittest discover -s rewrite/ci -p 'test_*.py' -v
  experimental-packages:
    if: github.event_name == 'workflow_dispatch' && inputs.build_packages && !inputs.verify_artifact
    needs: ci-policy
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rewrite-packaging.yml
    with:
      sign_android: ${{ inputs.sign_android }}
  windows-tests:
    if: ${{ !inputs.verify_artifact }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.18"
      - name: Install media verification and Qt runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core
      - name: Install desktop dependencies
        run: python -m pip install -r rewrite/windows/requirements.txt
      - name: Pin pure-Python extractor for isolated owned-fixture experiment
        run: |
          python -m pip install --force-reinstall --require-hashes --only-binary=:all: --no-deps -r rewrite/experiments/android_ytdlp/requirements.lock
      - name: Run engine and headless Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s rewrite/windows -p "test_*.py" -v
  android-debug:
    if: ${{ !inputs.verify_artifact }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewrite/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: Compile APKs and run JVM tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Lint after generated test sources are stable
        run: gradle --no-daemon :app:lintDebug
      - name: Verify executed JVM tests
        if: always()
        run: python3 tools/report-tests.py app/build/test-results/testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TheKaiN-rebuild-Android-0.1-debug
          path: rewrite/android/app/build/outputs/apk/debug/app-debug.apk
  android-device-tests:
    if: ${{ !inputs.verify_artifact }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /tmp/thekain-m4-avd
    defaults:
      run:
        working-directory: rewrite/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.11.1"
      - name: Prepare official Android 35 emulator
        id: prepare-emulator
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=M4 emulator setup::Failed command on line $LINENO: $BASH_COMMAND"' ERR
          echo "::notice title=M4 emulator host::$(uname -m); ANDROID_HOME=$ANDROID_HOME; KVM=$(ls -l /dev/kvm 2>&1)"
          test -e /dev/kvm
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 libnss3
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n M4 -k 'system-images;android-35;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd M4 -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader -memory 2048 -cores 2 -port 5554 > "$RUNNER_TEMP/m4-emulator.log" 2>&1 &
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          for i in $(seq 1 180); do
            if [ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
      - name: Expose emulator startup diagnostics
        if: failure()
        run: |
          python3 - <<'PYLOG'
          import pathlib, os
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'm4-emulator.log'
          content = path.read_text(errors='replace')[-6500:] if path.exists() else 'No emulator log was created.'
          print('::error title=M4 emulator log::' + content.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYLOG
      - name: Run actual device integration tests
        run: |
          gradle --no-daemon :app:installDebug :app:installDebugAndroidTest
          adb -s "$ANDROID_SERIAL" shell pm grant com.thekain.video.rebuild android.permission.POST_NOTIFICATIONS
          bash tools/emulator-ui-ready.sh "$RUNNER_TEMP/m4-device-evidence/ui-readiness"
          gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.listener=com.thekain.video.UiFailureListener -Pandroid.testInstrumentationRunnerArguments.notClass=com.thekain.video.ProcessRestartTest,com.thekain.video.NotificationDeniedTest,com.thekain.video.M5VisualTest
      - name: Verify instrumentation results
        if: always()
        run: python3 tools/report-tests.py app/build/outputs/androidTest-results/connected 41
      - name: Collect UI state at failure before process restart
        if: always() && steps.prepare-emulator.conclusion == 'success'
        run: bash tools/collect-ui-failure-evidence.sh "$RUNNER_TEMP/m4-device-evidence"
      - name: Collect completed-removal dialog and pending-state evidence
        if: always() && steps.prepare-emulator.conclusion == 'success'
        run: |
          if adb -s "$ANDROID_SERIAL" shell run-as com.thekain.video.rebuild ls files/removal-evidence >/dev/null 2>&1; then
            adb -s "$ANDROID_SERIAL" exec-out run-as com.thekain.video.rebuild tar -C files -cf - removal-evidence | tar -xf - -C "$RUNNER_TEMP"
          fi
      - name: Cold process restart and adb UI evidence
        run: |
          gradle --no-daemon :app:installDebug :app:installDebugAndroidTest
          bash tools/process-restart-smoke.sh "$RUNNER_TEMP/m4-device-evidence"
      - name: Compose layouts at 360, 412 and 600 dp in both themes
        id: visual-matrix
        if: always() && steps.prepare-emulator.conclusion == 'success'
        run: |
          gradle --no-daemon :app:installDebug :app:installDebugAndroidTest
          bash tools/compose-visual-smoke.sh "$RUNNER_TEMP/m5-visual-evidence"
      - name: Prepare bounded UI review bundle
        if: always() && steps.visual-matrix.conclusion == 'success'
        run: |
          python3 -m pip install pillow==11.3.0
          python3 tools/visual-report.py "$RUNNER_TEMP/m5-visual-evidence"
      - name: Collect UI state from every instrumentation phase
        if: always() && steps.prepare-emulator.conclusion == 'success'
        run: bash tools/collect-ui-failure-evidence.sh "$RUNNER_TEMP/m4-device-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: M5-Android-device-validation
          path: |
            rewrite/android/app/build/outputs/androidTest-results/
            rewrite/android/app/build/reports/androidTests/
            ${{ runner.temp }}/m4-device-evidence/
            ${{ runner.temp }}/m5-visual-evidence/
            ${{ runner.temp }}/m4-emulator.log
            ${{ runner.temp }}/removal-evidence/
  android-legacy-device-tests:
    if: ${{ !inputs.verify_artifact }}
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: /tmp/thekain-removal-avd
      REMOVAL_API: ${{ matrix.api }}
    defaults:
      run:
        working-directory: rewrite/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Prepare official Android storage-boundary emulator
        run: |
          set -Eeuo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0 libglu1-mesa libxkbcommon-x11-0 libxcb-cursor0 libnss3
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' "system-images;android-$REMOVAL_API;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n Removal -k "system-images;android-$REMOVAL_API;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd Removal -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader -memory 2048 -cores 2 -port 5554 > "$RUNNER_TEMP/removal-emulator.log" 2>&1 &
          timeout 180 adb -s "$ANDROID_SERIAL" wait-for-device
          booted=false
          for i in $(seq 1 120); do
            if [ "$(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
      - name: Verify actual runtime API and completed-removal storage flows
        run: |
          test "$(adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')" = "$REMOVAL_API"
          gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.thekain.video.CompletedRemovalInstrumentationTest
      - name: Report executed storage tests
        if: always()
        run: python3 tools/report-tests.py app/build/outputs/androidTest-results/connected
      - name: Save runtime identity and crash evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/removal-runtime"
          adb -s "$ANDROID_SERIAL" shell getprop ro.build.version.sdk > "$RUNNER_TEMP/removal-runtime/api.txt" || true
          adb -s "$ANDROID_SERIAL" logcat -b crash -d > "$RUNNER_TEMP/removal-runtime/crash.txt" || true
          cp "$RUNNER_TEMP/removal-emulator.log" "$RUNNER_TEMP/removal-runtime/" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: M6-completed-removal-API-${{ matrix.api }}
          path: |
            rewrite/android/app/build/outputs/androidTest-results/
            rewrite/android/app/build/reports/androidTests/
            ${{ runner.temp }}/removal-runtime/
          if-no-files-found: error
  android-signed-internal-qa:
    if: inputs.build_packages && inputs.sign_android && needs.experimental-packages.outputs.signing-authorized == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rebuild-2026-11-11' && !inputs.verify_artifact
    needs: [ci-policy, windows-tests, android-debug, android-device-tests, experimental-packages]
    permissions:
      contents: read
      actions: read
    environment: release-signing
    concurrency:
      group: thekain-android-signing
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Recheck branch tip and environment after approval, before exposing key material
        id: policy-recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 rewrite/ci/signing_policy.py --requested true
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        id: setup-java
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download-unsigned
        with:
          artifact-ids: ${{ needs.experimental-packages.outputs.signing-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/thekain-unsigned-input
      - name: Reject substituted artifacts before the secret-bearing step
        id: verify-unsigned
        env:
          APK_SHA: ${{ needs.experimental-packages.outputs.apk-sha }}
          AAB_SHA: ${{ needs.experimental-packages.outputs.aab-sha }}
          MANIFEST_SHA: ${{ needs.experimental-packages.outputs.manifest-sha }}
        run: python3 rewrite/ci/artifact_signing.py verify --input "$RUNNER_TEMP/thekain-unsigned-input" --commit "$GITHUB_SHA" --apk-sha "$APK_SHA" --aab-sha "$AAB_SHA" --manifest-sha "$MANIFEST_SHA"
      - name: Sign verified APK/AAB copies; no project build or cache receives the key
        id: sign-artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          THEKAIN_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          THEKAIN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          THEKAIN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          APK_SHA: ${{ needs.experimental-packages.outputs.apk-sha }}
          AAB_SHA: ${{ needs.experimental-packages.outputs.aab-sha }}
          MANIFEST_SHA: ${{ needs.experimental-packages.outputs.manifest-sha }}
        run: python3 rewrite/ci/artifact_signing.py sign --input "$RUNNER_TEMP/thekain-unsigned-input" --commit "$GITHUB_SHA" --apk-sha "$APK_SHA" --aab-sha "$AAB_SHA" --manifest-sha "$MANIFEST_SHA" --tools "$ANDROID_HOME/build-tools/35.0.0" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/thekain-signed-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-signed
        with:
          name: M6-Android-signed-INTERNAL-QA
          path: ${{ runner.temp }}/thekain-signed-output/
          if-no-files-found: error
          retention-days: 7
  android-independent-verifier:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rebuild-2026-11-11' && inputs.verify_artifact && !inputs.build_packages && !inputs.sign_android && inputs.verification_target != 'qa89'
    needs: ci-policy
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        id: setup-java
        with:
          distribution: temurin
          java-version: '17'
      - name: Independently verify original archive with official SDK and JDK tools
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BYPASS_PREFLIGHT_COMMENT_ID: ${{ inputs.bypass_preflight_comment }}
        run: python3 rewrite/ci/android_artifact_verifier.py --output "$RUNNER_TEMP/thekain-independent-verification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-report
        if: always()
        with:
          name: M6-Android-independent-verification
          path: ${{ runner.temp }}/thekain-independent-verification/
          if-no-files-found: error

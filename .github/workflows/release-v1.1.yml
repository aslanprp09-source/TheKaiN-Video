name: Publish TheKaiN Video 1.1 test APK

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download successful build output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_ID" ]; then
            run_id="$RUN_ID"
          else
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          mkdir -p release
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name TheKaiN-Video-debug-apk --dir release
          test -s release/app-debug.apk
          unzip -t release/app-debug.apk >/dev/null
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$aapt_bin"
          "$aapt_bin" dump badging release/app-debug.apk | tee release/badging.txt
          grep -q "versionName='1.1.0'" release/badging.txt
      - name: Publish APK release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="TheKaiN Video 1.1.0 · tested compile Android 10+. YouTube-inspired dark UI, format picker, one-tap clear, playlist mode, pause/resume. Resume is best-effort, depends on site. Debug build; phone testing pending. A different debug signing key may require uninstalling the previous APK."
          if gh release view v1.1.0-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.1.0-test release/app-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.1.0-test --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.1.0-test release/app-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "TheKaiN Video 1.1.0 — redesigned Android test APK" \
              --notes "$notes" --prerelease
          fi
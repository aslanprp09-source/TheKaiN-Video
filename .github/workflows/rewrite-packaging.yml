name: Rebuild experimental packages — no publication
on:
  workflow_call:
    outputs:
      signing-authorized:
        description: Public policy decision; never contains signing credentials
        value: ${{ jobs.signing-policy.outputs.authorized }}
      signing-artifact-id:
        description: Unsigned artifact uploaded by this workflow run
        value: ${{ jobs.android-unsigned.outputs.signing-artifact-id }}
      apk-sha:
        description: Same-run unsigned APK SHA-256
        value: ${{ jobs.android-unsigned.outputs.apk-sha }}
      aab-sha:
        description: Same-run unsigned AAB SHA-256
        value: ${{ jobs.android-unsigned.outputs.aab-sha }}
      manifest-sha:
        description: Same-run unsigned manifest SHA-256
        value: ${{ jobs.android-unsigned.outputs.manifest-sha }}
    inputs:
      sign_android:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      sign_android:
        type: boolean
        default: false
        description: Audit eligibility only; protected signing runs through Clean rebuild
permissions:
  contents: read
jobs:
  signing-policy:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.policy.outputs.authorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - name: Enforce workflow policy for reusable and direct dispatch callers
        id: workflow-check
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r rewrite/ci/requirements.lock
          python rewrite/ci/workflow_policy.py
      - name: Audit protected environment without access to signing secrets
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_ANDROID_REQUESTED: ${{ inputs.sign_android }}
        run: python3 rewrite/ci/signing_policy.py --requested "$SIGN_ANDROID_REQUESTED"
  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Install exact reviewed wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes --no-deps -r rewrite/release/windows/requirements-build.lock
      - name: Prepare hash-verified official build tools
        shell: pwsh
        run: |
          ./rewrite/release/windows/prepare-tools.ps1 -Destination "$env:RUNNER_TEMP/thekain-tools" *>&1 | Tee-Object "$env:RUNNER_TEMP/m6-tools.log"
          $paths = Get-Content "$env:RUNNER_TEMP/thekain-tools/paths.json" -Raw | ConvertFrom-Json
          $paths.ffmpegBin >> $env:GITHUB_PATH
          "THEKAIN_ISCC=$($paths.iscc)" >> $env:GITHUB_ENV
      - name: Native Windows engine and Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python rewrite/release/run-windows-tests.py
          python -m unittest discover -s rewrite/release -p "test_*.py" -v
      - name: Freeze GUI and worker, collect notices, compile installer and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./rewrite/release/windows/build.ps1 -Iscc $env:THEKAIN_ISCC -Commit $env:GITHUB_SHA *>&1 | Tee-Object "$env:RUNNER_TEMP/m6-build.log"
      - name: Install, exercise packaged pipeline and Qt, uninstall on disposable host
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem rewrite/release/out/windows-artifacts/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          ./rewrite/release/windows/smoke-installed.ps1 -Installer ($installers[0].FullName) -Evidence "$env:RUNNER_TEMP/thekain-installed-qa" *>&1 | Tee-Object "$env:RUNNER_TEMP/m6-installed.log"
      - name: Expose bounded owned native UI preview
        run: python rewrite/release/windows/review-evidence.py "$env:RUNNER_TEMP/thekain-installed-qa/installed-run"
      - name: Expose bounded packaging failure diagnostics
        if: failure()
        shell: python
        run: |
          import os, pathlib
          for path in pathlib.Path(os.environ['RUNNER_TEMP']).glob('m6-*.log'):
              value = path.read_text(errors='replace')[-3500:]
              print('::error title=' + path.name + '::' + value.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: M6-Windows-unsigned-experimental
          if-no-files-found: error
          path: |
            rewrite/release/out/windows-artifacts/
            ${{ runner.temp }}/thekain-installed-qa/installed-run/
            ${{ runner.temp }}/thekain-installed-qa/host.json
            ${{ runner.temp }}/thekain-installed-qa/*install.log
            ${{ runner.temp }}/m6-*.log
  android-unsigned:
    outputs:
      signing-artifact-id: ${{ steps.signing-input.outputs.artifact-id }}
      apk-sha: ${{ steps.proof.outputs.apk_sha256 }}
      aab-sha: ${{ steps.proof.outputs.aab_sha256 }}
      manifest-sha: ${{ steps.proof.outputs.manifest_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rewrite/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Test and build actual unsigned release variants
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease
      - name: Run release Lint separately
        run: gradle --no-daemon :app:lintRelease
      - name: Verify release tests, identity, notices and absence of signatures
        run: |
          python3 tools/report-tests.py app/build/test-results/testReleaseUnitTest
          python3 ../release/inspect-android.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --aab app/build/outputs/bundle/release/app-release.aab --tools "$ANDROID_HOME/build-tools/35.0.0" --output ../release/out/android-unsigned
          python3 ../release/manifest.py ../release/out/android-unsigned --commit "$GITHUB_SHA" --platform android --channel unsigned-experimental
          echo '::notice title=M6 signing::BLOCKED: default build is unsigned; configure protected signing access and request internal QA signing explicitly.'
      - name: Bind unsigned signing inputs to source and same-run digests
        id: proof
        run: python3 ../ci/artifact_signing.py proof --input ../release/out/android-unsigned --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: signing-input
        with:
          name: M6-Android-signing-input-${{ github.sha }}
          path: rewrite/release/out/android-unsigned/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: M6-Android-unsigned-experimental
          if-no-files-found: error
          path: |
            rewrite/release/out/android-unsigned/
            rewrite/android/app/build/generated/releaseLegal/
            rewrite/android/app/build/reports/lint-results-release.*
            rewrite/android/app/build/test-results/testReleaseUnitTest/
  signing-rehearsal:
    needs: android-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.android-unsigned.outputs.signing-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/thekain-rehearsal-input
      - name: Verify same-run proof after artifact download
        env:
          APK_SHA: ${{ needs.android-unsigned.outputs.apk-sha }}
          AAB_SHA: ${{ needs.android-unsigned.outputs.aab-sha }}
          MANIFEST_SHA: ${{ needs.android-unsigned.outputs.manifest-sha }}
        run: python3 rewrite/ci/artifact_signing.py verify --input "$RUNNER_TEMP/thekain-rehearsal-input" --commit "$GITHUB_SHA" --apk-sha "$APK_SHA" --aab-sha "$AAB_SHA" --manifest-sha "$MANIFEST_SHA"
      - name: Rehearse tools on a fresh host with a disposable key; upload no signed test output
        env:
          CI_UNSIGNED_INPUT: ${{ runner.temp }}/thekain-rehearsal-input
        run: python3 rewrite/ci/signing_rehearsal.py

name: Build Windows TheKaiN Video

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'windows-v12/**'
      - 'windows-v124/**'
      - 'windows-v125/**'
      - 'windows-v130/**'
      - 'windows-v140/**'
      - 'windows-v141/**'
      - 'windows-v200/**'
      - 'windows-hotfix-121/**'
      - 'windows-optimizations/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Restore complete verified Windows 1.4.0 sources
        shell: pwsh
        run: |
          @'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          parts = sorted(Path('windows-v140').glob('source-part-*.txt'))
          assert len(parts) == 5, f'Missing source parts: {len(parts)}'
          archive = base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts))
          digest = hashlib.sha256(archive).hexdigest()
          assert digest == '549f150c907d4b9f8c9612ad9f8475aafe8cad08dafdd198208cb7f600953b4e', digest
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as tar:
              tar.extractall(path='.', filter='data')
          assert 'APP_VERSION = "1.4.0"' in Path('windows/app.py').read_text(encoding='utf-8')
          assert Path('windows/tests/test_speed.py').is_file()
          assert Path('windows/tests/integration_speed.py').is_file()
          print('Verified complete Windows 1.4.0 source archive:', digest)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Windows 1.4 source verification failed' }
      - name: Apply verified 1.4.1 download completion fix
        shell: pwsh
        run: |
          @'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          payload = base64.b64decode(Path("windows-v141/hotfix.tar.xz.base64").read_text(encoding="ascii").strip())
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == "b084664502b72c18cf51537d13ecbcc9882ecb2b154f401d7620e8456a4b0a50", digest
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:xz") as tar:
              tar.extractall(path=".", filter="data")
          assert 'APP_VERSION = "1.4.1"' in Path("windows/app.py").read_text(encoding="utf-8")
          assert Path("windows/tests/test_finish_141.py").is_file()
          print("Windows 1.4.1 completion fixes applied:", digest)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Completion fix source verification failed' }
      - name: Install the fully rewritten Windows 2.0 transfer engine
        shell: pwsh
        run: |
          @'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          content = base64.b64decode(Path("windows-v200/engine-overlay.tar.xz.base64").read_text(encoding="ascii").strip())
          digest = hashlib.sha256(content).hexdigest()
          assert digest == "7a91af033002c54cdb253a659be37822f8d9963a69f91d9b7de512c780f8a9aa", digest
          with tarfile.open(fileobj=io.BytesIO(content), mode="r:xz") as tar:
              tar.extractall(path=".", filter="data")
          assert 'APP_VERSION = "2.0.0"' in Path("windows/app.py").read_text(encoding="utf-8")
          assert Path("windows/engine_v2.py").is_file()
          assert Path("windows/tests_v2/test_transfer_engine.py").is_file()
          print("Verified TheKaiN Windows 2.0 clean pipeline", digest)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Windows 2.0 pipeline source verification failed' }
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements-build.txt
      - name: Verify Windows source and tests
        shell: pwsh
        run: |
          python -m compileall -q windows
          python -m pytest -q windows/tests/test_core.py windows/tests/test_shortcuts.py windows/tests/test_speed.py windows/tests/test_install_paths.py
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility unit tests failed' }
          $tests = (python -m pytest --collect-only -q windows/tests/test_core.py windows/tests/test_shortcuts.py windows/tests/test_speed.py windows/tests/test_install_paths.py | Select-String 'tests collected')
          Write-Host "Test discovery: $tests"
      - name: Generate selected Windows application icon
        shell: pwsh
        run: |
          python windows/build_icon.py
          $payload = (Get-Content -Raw 'windows-source/selected-icon.webp.base64').Trim()
          [IO.File]::WriteAllBytes('windows/assets/selected.webp', [Convert]::FromBase64String($payload))
          python -c "from PIL import Image; im=Image.open('windows/assets/selected.webp').convert('RGB'); im.save('windows/assets/TheKaiN.png'); im.save('windows/assets/TheKaiN.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Bundle application with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name TheKaiN-Video --paths windows --icon windows/assets/TheKaiN.ico --add-data 'windows/assets;assets' --collect-data customtkinter windows/app.py
          if (-not (Test-Path 'dist/TheKaiN-Video/TheKaiN-Video.exe')) { throw 'Executable missing' }
      - name: Include yt-dlp, FFmpeg and Deno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $out = Join-Path $PWD 'dist/TheKaiN-Video/tools'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile "$out/yt-dlp.exe"
          & "$out/yt-dlp.exe" --version

          $ffzip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          try {
            Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $ffzip
          } catch {
            Write-Host 'Primary FFmpeg mirror unavailable, using GitHub mirror'
            Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $ffzip
          }
          $ffextract = Join-Path $env:RUNNER_TEMP 'thekain-ffmpeg'
          New-Item -ItemType Directory -Force -Path $ffextract | Out-Null
          Expand-Archive -Path $ffzip -DestinationPath $ffextract -Force
          $ff = Get-ChildItem $ffextract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $fp = Get-ChildItem $ffextract -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          if (!$ff -or !$fp) { throw 'FFmpeg or ffprobe missing in upstream archive' }
          Copy-Item $ff.FullName "$out/ffmpeg.exe"
          Copy-Item $fp.FullName "$out/ffprobe.exe"
          & "$out/ffmpeg.exe" -version | Select-Object -First 1

          $denozip = Join-Path $env:RUNNER_TEMP 'deno.zip'
          Invoke-WebRequest 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile $denozip
          $denoextract = Join-Path $env:RUNNER_TEMP 'thekain-deno'
          New-Item -ItemType Directory -Force -Path $denoextract | Out-Null
          Expand-Archive -Path $denozip -DestinationPath $denoextract -Force
          Copy-Item "$denoextract/deno.exe" "$out/deno.exe"
          & "$out/deno.exe" --version | Select-Object -First 1

          # Official aria2c Windows x64 downloader for HTTP multi-connection transfer.
          $ariaZip = Join-Path $env:RUNNER_TEMP 'thekain-aria2.zip'
          Invoke-WebRequest 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip' -OutFile $ariaZip
          $ariaExtract = Join-Path $env:RUNNER_TEMP 'thekain-aria2'
          New-Item -ItemType Directory -Force -Path $ariaExtract | Out-Null
          Expand-Archive -Path $ariaZip -DestinationPath $ariaExtract -Force
          $ariaExe = Get-ChildItem $ariaExtract -Filter 'aria2c.exe' -File -Recurse | Select-Object -First 1
          if (-not $ariaExe) { throw 'Official aria2c.exe not found' }
          Copy-Item $ariaExe.FullName "$out/aria2c.exe"
          & "$out/aria2c.exe" --version | Select-Object -First 1
      - name: Verify new transfer engine with FFprobe and interruption regressions
        shell: pwsh
        run: |
          $env:PATH = (Resolve-Path 'dist/TheKaiN-Video/tools').Path + ';' + $env:PATH
          python -m pytest -q windows/tests_v2/test_transfer_engine.py
          if ($LASTEXITCODE -ne 0) { throw 'Transfer v2 regressions failed' }
      - name: Verify fast HTTP Range transfer via yt-dlp and aria2c
        shell: pwsh
        run: |
          python windows/tests/integration_speed.py
          if ($LASTEXITCODE -ne 0) { throw 'Accelerated HTTP integration failed' }
      - name: Real media download with bundled yt-dlp (localhost integration)
        shell: pwsh
        run: |
          python windows/tests/integration_download.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual media download regression failed' }
      - name: Recover downloaded video and audio using bundled FFmpeg (offline)
        shell: pwsh
        run: |
          python windows/tests/integration_recovery.py
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg recovery integration failed' }
      - name: End-to-end yt-dlp download through new transfer engine
        shell: pwsh
        run: |
          python windows/tests_v2/integration_http.py
          if ($LASTEXITCODE -ne 0) { throw 'New engine failed local HTTP MP4 end-to-end integration' }
      - name: Desktop smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/TheKaiN-Video/TheKaiN-Video.exe') -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Desktop smoke test failed ($($p.ExitCode))" }
      - name: Windows GUI smoke test with theme switching
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/TheKaiN-Video/TheKaiN-Video.exe') -ArgumentList '--ui-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Desktop GUI test failed ($($p.ExitCode))" }
      - name: Verify keyboard shortcuts in packaged Windows EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/TheKaiN-Video/TheKaiN-Video.exe') -ArgumentList '--keyboard-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged EXE keyboard test failed ($($p.ExitCode))" }
      - name: Prepare portable release ZIP
        shell: pwsh
        run: |
          Copy-Item 'windows/README_RU.md' 'dist/TheKaiN-Video/README_RU.md'
          Copy-Item 'windows/ARCHITECTURE_2_0_RU.md' 'dist/TheKaiN-Video/ARCHITECTURE_2_0_RU.md'
          Copy-Item 'windows/THIRD_PARTY_NOTICES.txt' 'dist/TheKaiN-Video/THIRD_PARTY_NOTICES.txt'
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path 'dist/TheKaiN-Video' -DestinationPath 'release/TheKaiN-Video-Windows-x64-portable.zip' -CompressionLevel Optimal
          $zip = Get-Item 'release/TheKaiN-Video-Windows-x64-portable.zip'
          if ($zip.Length -lt 10000000) { throw 'Portable ZIP is unexpectedly small' }
          Write-Host "Portable ZIP size: $($zip.Length) bytes"
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'ISCC.exe was not installed' }
      - name: Compile Windows EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $compiler '/Qp' 'windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC compilation failed with code $LASTEXITCODE" }
          $setup = 'release/TheKaiN-Video-Setup-x64.exe'
          if (-not (Test-Path $setup)) { throw 'Setup EXE not found' }
          if ((Get-Item $setup).Length -lt 5000000) { throw 'Setup EXE size is implausibly small' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
      - name: Verify installation, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'release/TheKaiN-Video-Setup-x64.exe').Path
          $targets = @(
            (Join-Path $env:RUNNER_TEMP 'TheKaiN Path With Spaces'),
            (Join-Path $env:RUNNER_TEMP 'TheKaiN Папка с пробелами')
          )
          foreach ($install in $targets) {
            Write-Host "Testing custom installation folder: $install"
            $quotedPath = '/DIR="' + $install + '"'
            $arguments = '/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- ' + $quotedPath
            $p = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installer returned $($p.ExitCode) in $install" }
            $app = Join-Path $install 'TheKaiN-Video.exe'
            if (-not (Test-Path $app)) { throw "Installed app missing: $app" }
            foreach ($tool in @('yt-dlp.exe','ffmpeg.exe','ffprobe.exe','deno.exe','aria2c.exe')) {
              if (-not (Test-Path (Join-Path $install "tools/$tool"))) { throw "Installer missing tool: $tool" }
            }
            $test = Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru
            if ($test.ExitCode -ne 0) { throw "Installed app self-test failed $($test.ExitCode)" }
            $uninstaller = Join-Path $install 'unins000.exe'
            if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing: $install" }
            $un = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
            if ($un.ExitCode -ne 0) { throw "Uninstaller returned $($un.ExitCode)" }
          }
          Write-Host 'Custom paths with spaces / Cyrillic: install, launch, uninstall passed'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TheKaiN-Video-Windows-x64-installer
          path: release/TheKaiN-Video-Setup-x64.exe
          if-no-files-found: error
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TheKaiN-Video-Windows-x64-portable
          path: release/TheKaiN-Video-Windows-x64-portable.zip
          if-no-files-found: error
      - name: Publish optimized Windows installer and portable ZIP
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v2.0.0-windows-test'
          $installer = 'release/TheKaiN-Video-Setup-x64.exe'
          $portable = 'release/TheKaiN-Video-Windows-x64-portable.zip'
          $notes = 'TheKaiN Video 2.0.0 Windows: fully rewritten download orchestration. Per-job isolated stage, FFprobe validation, atomic publish, resumable private workspaces, idempotent published journal, safe pause/cancel, queue 1-4 and diagnostic logs. 100 percent never means completed. yt-dlp remains replaceable engine for sites, with FFmpeg, Deno, optional aria2. Research of yt-dlp, Stacher, JDownloader, Seal, YTDLnis in included architecture report. Regression, media integration, GUI, installer verification. Unsigned beta.'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $portable --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --notes $notes --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer $portable --repo $env:GITHUB_REPOSITORY --title 'TheKaiN Video 2.0.0 — Rewritten download engine' --notes $notes --prerelease
          }

name: Build Windows TheKaiN Video

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'windows-v12/**'
      - 'windows-hotfix-121/**'
      - 'windows-optimizations/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Restore verified Windows source via Python
        shell: pwsh
        run: |
          @'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          content = base64.b64decode(Path('windows-v12/source.tar.xz.base64').read_text(encoding='ascii').strip())
          actual = hashlib.sha256(content).hexdigest()
          assert actual == '5e938a8c90fb8422970822d566b4ab398b082373b13193b37ea1d59383b607ec', actual
          with tarfile.open(fileobj=io.BytesIO(content), mode='r:xz') as tar:
              tar.extractall(path='.', filter='data')
          assert Path('windows/app.py').is_file()
          assert 'APP_VERSION = "1.2.0"' in Path('windows/app.py').read_text(encoding='utf-8')
          print('TheKaiN Windows 1.2 archive extracted and verified')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Verified source extraction failed' }
      - name: Apply verified 1.2.1 installation and download path hotfix
        shell: pwsh
        run: |
          @'
          import base64, gzip, hashlib
          from pathlib import Path
          source = Path("windows-hotfix-121/install-path-fix.patch.gz.base64")
          content = gzip.decompress(base64.b64decode(source.read_text(encoding="ascii").strip()))
          digest = hashlib.sha256(content).hexdigest()
          expected = "41912f451cfb61de12108999e13245b9a4622784ecf278273b76ccddf4988d6e"
          assert digest == expected, f"Hotfix checksum mismatch: {digest}"
          Path("install-path-fix.patch").write_bytes(content)
          print("Verified installer hotfix", digest)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Hotfix decode failed" }
          git apply --check install-path-fix.patch
          if ($LASTEXITCODE -ne 0) { throw "Hotfix cannot be applied" }
          git apply install-path-fix.patch
          if ($LASTEXITCODE -ne 0) { throw "Hotfix apply failed" }
          if (-not (Select-String -Path windows/installer.iss -Pattern 'PrivilegesRequiredOverridesAllowed=dialog' -Quiet)) {
            throw "Installer elevation chooser missing"
          }
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements-build.txt
      - name: Verify Windows source and tests
        shell: pwsh
        run: |
          python -m compileall -q windows
          python -m pytest -q windows/tests
          if ($LASTEXITCODE -ne 0) { throw 'Python unit tests failed' }
          $tests = (python -m pytest --collect-only -q windows/tests | Select-String 'tests collected')
          Write-Host "Test discovery: $tests"
      - name: Generate selected Windows application icon
        shell: pwsh
        run: |
          python windows/build_icon.py
          $payload = (Get-Content -Raw 'windows-source/selected-icon.webp.base64').Trim()
          [IO.File]::WriteAllBytes('windows/assets/selected.webp', [Convert]::FromBase64String($payload))
          python -c "from PIL import Image; im=Image.open('windows/assets/selected.webp').convert('RGB'); im.save('windows/assets/TheKaiN.png'); im.save('windows/assets/TheKaiN.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Bundle application with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name TheKaiN-Video --paths windows --icon windows/assets/TheKaiN.ico --add-data 'windows/assets;assets' --collect-data customtkinter windows/app.py
          if (-not (Test-Path 'dist/TheKaiN-Video/TheKaiN-Video.exe')) { throw 'Executable missing' }
      - name: Include yt-dlp, FFmpeg and Deno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $out = Join-Path $PWD 'dist/TheKaiN-Video/tools'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile "$out/yt-dlp.exe"
          & "$out/yt-dlp.exe" --version

          $ffzip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          try {
            Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $ffzip
          } catch {
            Write-Host 'Primary FFmpeg mirror unavailable, using GitHub mirror'
            Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $ffzip
          }
          $ffextract = Join-Path $env:RUNNER_TEMP 'thekain-ffmpeg'
          New-Item -ItemType Directory -Force -Path $ffextract | Out-Null
          Expand-Archive -Path $ffzip -DestinationPath $ffextract -Force
          $ff = Get-ChildItem $ffextract -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $fp = Get-ChildItem $ffextract -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          if (!$ff -or !$fp) { throw 'FFmpeg or ffprobe missing in upstream archive' }
          Copy-Item $ff.FullName "$out/ffmpeg.exe"
          Copy-Item $fp.FullName "$out/ffprobe.exe"
          & "$out/ffmpeg.exe" -version | Select-Object -First 1

          $denozip = Join-Path $env:RUNNER_TEMP 'deno.zip'
          Invoke-WebRequest 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile $denozip
          $denoextract = Join-Path $env:RUNNER_TEMP 'thekain-deno'
          New-Item -ItemType Directory -Force -Path $denoextract | Out-Null
          Expand-Archive -Path $denozip -DestinationPath $denoextract -Force
          Copy-Item "$denoextract/deno.exe" "$out/deno.exe"
          & "$out/deno.exe" --version | Select-Object -First 1
      - name: Desktop smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/TheKaiN-Video/TheKaiN-Video.exe') -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Desktop smoke test failed ($($p.ExitCode))" }
      - name: Windows GUI smoke test with theme switching
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/TheKaiN-Video/TheKaiN-Video.exe') -ArgumentList '--ui-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Desktop GUI test failed ($($p.ExitCode))" }
      - name: Prepare portable release ZIP
        shell: pwsh
        run: |
          Copy-Item 'windows/README_RU.md' 'dist/TheKaiN-Video/README_RU.md'
          Copy-Item 'windows/THIRD_PARTY_NOTICES.txt' 'dist/TheKaiN-Video/THIRD_PARTY_NOTICES.txt'
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path 'dist/TheKaiN-Video' -DestinationPath 'release/TheKaiN-Video-Windows-x64-portable.zip' -CompressionLevel Optimal
          $zip = Get-Item 'release/TheKaiN-Video-Windows-x64-portable.zip'
          if ($zip.Length -lt 10000000) { throw 'Portable ZIP is unexpectedly small' }
          Write-Host "Portable ZIP size: $($zip.Length) bytes"
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'ISCC.exe was not installed' }
      - name: Compile Windows EXE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $compiler '/Qp' 'windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC compilation failed with code $LASTEXITCODE" }
          $setup = 'release/TheKaiN-Video-Setup-x64.exe'
          if (-not (Test-Path $setup)) { throw 'Setup EXE not found' }
          if ((Get-Item $setup).Length -lt 5000000) { throw 'Setup EXE size is implausibly small' }
          Get-FileHash $setup -Algorithm SHA256 | Format-List
      - name: Verify installation, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'release/TheKaiN-Video-Setup-x64.exe').Path
          $targets = @(
            (Join-Path $env:RUNNER_TEMP 'TheKaiN Path With Spaces'),
            (Join-Path $env:RUNNER_TEMP 'TheKaiN Папка с пробелами')
          )
          foreach ($install in $targets) {
            Write-Host "Testing custom installation folder: $install"
            $quotedPath = '/DIR="' + $install + '"'
            $arguments = '/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- ' + $quotedPath
            $p = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installer returned $($p.ExitCode) in $install" }
            $app = Join-Path $install 'TheKaiN-Video.exe'
            if (-not (Test-Path $app)) { throw "Installed app missing: $app" }
            foreach ($tool in @('yt-dlp.exe','ffmpeg.exe','ffprobe.exe','deno.exe')) {
              if (-not (Test-Path (Join-Path $install "tools/$tool"))) { throw "Installer missing tool: $tool" }
            }
            $test = Start-Process -FilePath $app -ArgumentList '--self-test' -Wait -PassThru
            if ($test.ExitCode -ne 0) { throw "Installed app self-test failed $($test.ExitCode)" }
            $uninstaller = Join-Path $install 'unins000.exe'
            if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing: $install" }
            $un = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
            if ($un.ExitCode -ne 0) { throw "Uninstaller returned $($un.ExitCode)" }
          }
          Write-Host 'Custom paths with spaces / Cyrillic: install, launch, uninstall passed'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TheKaiN-Video-Windows-x64-installer
          path: release/TheKaiN-Video-Setup-x64.exe
          if-no-files-found: error
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TheKaiN-Video-Windows-x64-portable
          path: release/TheKaiN-Video-Windows-x64-portable.zip
          if-no-files-found: error
      - name: Publish optimized Windows installer and portable ZIP
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.2.1-windows-test'
          $installer = 'release/TheKaiN-Video-Setup-x64.exe'
          $portable = 'release/TheKaiN-Video-Windows-x64-portable.zip'
          $notes = 'TheKaiN Video 1.2.1 Windows hotfix. Installer always displays custom installation folder. Users may choose per-user install without admin, or all-users install with elevation (for Program Files). Warnings for protected system paths in per-user mode. Download directory selection now tests write access before saving settings. Tests include spaces and Cyrillic paths, install/run/uninstall. Other 1.2 functionality unchanged. Unsigned beta build.'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $portable --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --notes $notes --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer $portable --repo $env:GITHUB_REPOSITORY --title 'TheKaiN Video 1.2.1 — Windows path hotfix' --notes $notes --prerelease
          }

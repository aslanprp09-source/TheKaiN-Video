name: Independent official verification of pinned APK89
on:
  workflow_call:
    inputs:
      bypass_preflight_comment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      bypass_preflight_comment:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/rebuild-2026-11-11'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        id: setup-python
        with:
          python-version: '3.11.18'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        id: setup-java
        with:
          distribution: temurin
          java-version: '17'
      - name: Enforce reviewed workflow boundary without signing fixtures
        id: policy
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r rewrite/ci/requirements.lock
          python rewrite/ci/workflow_policy.py
      - name: Verify original pinned QA89 archive with official tools
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BYPASS_PREFLIGHT_COMMENT_ID: ${{ inputs.bypass_preflight_comment }}
        run: python3 rewrite/ci/android_qa89_verifier.py --output "$RUNNER_TEMP/thekain-qa89-verification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload-report
        if: always()
        with:
          name: M6-Android-QA89-independent-verification
          path: ${{ runner.temp }}/thekain-qa89-verification/
          if-no-files-found: error
          retention-days: 7

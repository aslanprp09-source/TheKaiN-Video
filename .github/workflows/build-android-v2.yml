name: Build Android 2.0
on:
  push:
    branches: [main]
    paths:
      - 'android-v2/**'
      - '.github/workflows/build-android-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat android-v2/parts/part-*.txt | base64 -d > thekain-android-2.0.tar.xz
          echo "95bc5ebda70403dabb4b7de2972a0a9e22f7c321b8e3965d0b6ea9b5bd110d0c  thekain-android-2.0.tar.xz" | sha256sum --check
          tar -xJf thekain-android-2.0.tar.xz
          grep -q 'versionName = "2.0.0"' app/build.gradle.kts
          test -s app/src/main/java/com/thekain/video/DownloadService.kt
          test -s app/src/main/java/com/thekain/video/DownloadPolicy.kt
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and compile Android APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Inspect APK and verify app version
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee badging.txt
          grep -q "versionName='2.0.0'" badging.txt
          grep -q "package: name='com.thekain.video'" badging.txt
          sha256sum "$apk"
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheKaiN-Video-Android-2.0.0-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android 2.0 test release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v2.0.0-android-test"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          notes="TheKaiN Video Android 2.0.0 debug APK. Redesigned compact mobile UI with light/dark themes, video thumbnail preview, quality choices with known/estimated sizes, playlist support, persistent per-task queue, 1-3 concurrent downloads, adaptive concurrent fragments, pause/resume/cancel, postprocessing and MediaStore verification before 100%, yt-dlp update. Requires Android 10+. Debug-signed test build; physical Android-device and third-party-site testing remain pending. DRM not supported."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --title 'TheKaiN Video 2.0.0 — Android redesign and multi-download' --notes "$notes" --prerelease
          fi
